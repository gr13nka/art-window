# XcodeGen spec. The .xcodeproj is generated from this on the Mac mini and never
# checked in — see remote.sh. Targets: the logic framework, its tests, the app,
# and the widget extension.
name: ArtWindow
options:
  bundleIdPrefix: dev.artwindow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    # Blank by default: remote.sh's build/install pass the mini's own team.
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    # Cargo.toml's version is the only version there is; remote.sh overrides both.
    MARKETING_VERSION: 0.0.0
    CURRENT_PROJECT_VERSION: 1
    SDKROOT: iphoneos
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
targets:
  ArtWindowKit:
    type: framework
    platform: iOS
    sources:
      - path: ArtWindowKit
      # Referenced in place, like Gradle's assets.srcDir: there is no copy to drift.
      - path: ../catalogue/dist/paintings.tsv
        group: Resources
        buildPhase: resources
      # The painters' pictures and index, as a folder so they land under artists/.
      - path: ../catalogue/dist/artists
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.artwindow.kit
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        # The widget links this framework too, so it may only use extension-safe API.
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - sdk: WidgetKit.framework

  ArtWindowKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ArtWindowKitTests
    dependencies:
      - target: ArtWindowKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.artwindow.kit.tests
        GENERATE_INFOPLIST_FILE: YES

  ArtWindow:
    type: application
    platform: iOS
    sources:
      - path: ArtWindow
    dependencies:
      - target: ArtWindowKit
        embed: true
      - target: ArtWindowWidget
        embed: true
    # Generated by XcodeGen at project time (gitignored), so the keys below are
    # the only place they are written down.
    info:
      path: ArtWindow/Info.plist
      properties:
        CFBundleDisplayName: Art Window
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [dev.artwindow.refresh]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: ArtWindow/ArtWindow.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.artwindow]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.artwindow
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ArtWindowWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ArtWindowWidget
    dependencies:
      - target: ArtWindowKit
        embed: false
    info:
      path: ArtWindowWidget/Info.plist
      properties:
        CFBundleDisplayName: Art Window
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ArtWindowWidget/ArtWindowWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.artwindow]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.artwindow.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  # One scheme builds everything and runs the framework's tests, so
  # `xcodebuild test -scheme ArtWindow` is the whole check.
  ArtWindow:
    build:
      targets:
        ArtWindow: all
    test:
      targets:
        - ArtWindowKitTests
    run:
      config: Debug
    archive:
      config: Release
