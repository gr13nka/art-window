name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libdbus-1-dev pkg-config

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
          components: clippy, rustfmt

      - name: Build
        run: cargo build --release --locked

      - name: Check Linux installer
        if: runner.os == 'Linux'
        run: |
          sh -n linux/check-container.sh linux/install.sh
          install_root="$RUNNER_TEMP/art-window-install"
          ART_WINDOW_PREFIX="$install_root" \
            XDG_DATA_HOME="$install_root/share" \
            ./linux/install.sh
          test -x "$install_root/bin/art-window"
          grep -F "Exec=\"$install_root/bin/art-window\"" \
            "$install_root/share/applications/dev.artwindow.desktop"

      - name: Test
        run: cargo test --all-targets --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Formatting
        run: cargo fmt --check
