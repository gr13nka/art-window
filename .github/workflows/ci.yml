name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libdbus-1-dev pkg-config

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
          components: clippy, rustfmt

      - name: Build
        run: cargo build --release --locked

      - name: Check Linux installer
        if: runner.os == 'Linux'
        run: |
          sh -n linux/check-container.sh linux/install.sh
          install_root="$RUNNER_TEMP/art-window-install"
          ART_WINDOW_PREFIX="$install_root" \
            XDG_DATA_HOME="$install_root/share" \
            ./linux/install.sh
          test -x "$install_root/bin/art-window"
          grep -F "Exec=\"$install_root/bin/art-window\"" \
            "$install_root/share/applications/dev.artwindow.desktop"

      - name: Test
        run: cargo test --all-targets --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Formatting
        run: cargo fmt --check

  android:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test and build
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

  ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen --spec ios/project.yml

      # The runner's simulator names change with its Xcode, so take the first iPhone it has.
      - name: Test
        run: |
          SIM=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone[^(]*\(([0-9A-F-]{36})\)' | grep -oE '[0-9A-F-]{36}')
          xcodebuild test -project ios/ArtWindow.xcodeproj -scheme ArtWindow \
            -destination "id=$SIM" CODE_SIGNING_ALLOWED=NO
