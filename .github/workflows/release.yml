name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read Cargo.toml version and match the tag
        id: read
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          tag_version="${TAG_NAME#v}"
          if [ "$version" != "$tag_version" ]; then
            echo "::error::Tag $TAG_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    runs-on: macos-15
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'

      - name: Build DMG
        run: ./macos/dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/dist/*

  linux:
    # Deliberately older than the CI matrix's ubuntu-24.04: the release binary
    # links against this glibc, so building here keeps it usable on older
    # distributions too. See docs/GUIDE.md#install.
    runs-on: ubuntu-22.04
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libdbus-1-dev pkg-config

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'

      - name: Build tarball
        run: ./linux/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/dist/*

  android:
    runs-on: ubuntu-24.04
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Require a signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty; refusing to publish an unsigned APK"
            exit 1
          fi

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: ./gradlew --no-daemon -PappVersion="$APP_VERSION" assembleRelease

      - name: Stage APK
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p target/dist
          cp android/app/build/outputs/apk/release/app-release.apk \
            "target/dist/art-window-$VERSION-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: target/dist/*

  publish:
    runs-on: ubuntu-24.04
    needs: [version, macos, linux, android]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Art Window $VERSION" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY" \
            dist/*
