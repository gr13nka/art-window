[versions]
# A toolchain known to build together: AGP 8.7 wants Gradle 8.9+ and JDK 17, and the
# Compose compiler plugin must match the Kotlin version exactly. Every library below was
# chosen from what the development machine's Gradle cache already held — see docs/android.md.
agp = "8.7.2"
kotlin = "2.0.21"
composeBom = "2024.10.01"
activityCompose = "1.9.3"
coreKtx = "1.13.1"
coroutines = "1.8.1"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }

# Compose drives the single screen (:app's buildFeatures.compose). The BOM pins the version of
# every Compose artifact below, so those declarations carry no version.
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# Backs Rotation's StateFlow and MainActivity's preview decode off the main thread.
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Supplies the Compose compiler for :app; its version must track the Kotlin version.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
