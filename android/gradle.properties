# Memory limits are deliberately strict: an earlier scaffold attempt OOM-killed this
# machine. Do not raise these without a reason, and never run two Gradle builds at once.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.parallel=false
org.gradle.workers.max=2

android.useAndroidX=true
kotlin.code.style=official
