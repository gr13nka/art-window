[package]
name = "art-window"
version = "0.1.2"
edition = "2021"
rust-version = "1.88"
description = "A daily artwork on your desktop, always fit to the screen."
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
directories = "6"
tao = "0.36"
tray-icon = { version = "0.24", default-features = false, features = ["gtk"] }
# Only `placement` decodes, and only for automatic borders, the blur and the
# settings preview; JPEG and PNG are all a museum or a wallpaper folder serves.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(target_os = "linux")'.dependencies]
gdk = "0.18"
gdk-pixbuf = "0.18"
gio = "0.18"
glib = "0.18"
gtk = "0.18"
libloading = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = "0.37"
# Already in the tree by way of rusqlite and tao; named here for `proc_listallpids`,
# which `backdrop` uses to see whether a meeting is live.
libc = "0.2"
# Already in the tree by way of tao and tray-icon, so naming it here adds no code —
# only the right to build the block the wake notification is delivered through.
block2 = "0.6"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["CFRunLoop"] }
objc2-foundation = { version = "0.3", features = [
    "NSString", "NSURL", "NSDictionary", "NSValue", "NSArray", "NSError",
    "NSDate", "NSTimeZone", "NSNotification", "NSOperation", "NSGeometry", "block2",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSWorkspace", "NSScreen", "NSColor", "NSCell", "NSApplication", "objc2-core-foundation",
    # The favourites window. Most of these are already compiled in by way of tao
    # and tray-icon, but a feature nobody asks for is a feature a dependency may
    # stop asking for, and then the build breaks for reasons nothing here explains.
    "NSResponder", "NSView", "NSEvent", "NSGraphics", "NSBezierPath",
    "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext",
    "NSImageView", "NSScrollView", "NSClipView",
    "NSControl", "NSButton", "NSTextField", "NSFont", "NSParagraphStyle",
    # The settings tab.
    "NSSegmentedControl", "NSSegmentedCell", "NSSlider", "NSSliderCell", "NSColorWell",
    "NSColorSpace", "NSShadow", "NSAppearance", "NSText", "NSVisualEffectView", "NSWindow",
] }

[target.'cfg(windows)'.dependencies]
# The same release tao 0.36 already pulls in, so there is one copy of the Win32
# bindings in the tree — the rule the objc2 pin above follows for AppKit.
windows = { version = "0.61", features = [
    "Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_Graphics_Gdi",
    "Win32_System_Registry", "Win32_System_Power", "Win32_System_Time",
    "Win32_Security", "Win32_System_Threading", "Win32_System_Console", "Win32_System_LibraryLoader",
    "Win32_System_SystemServices", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls_Dialogs",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
