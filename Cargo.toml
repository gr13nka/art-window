[package]
name = "art-window"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A daily artwork on your desktop, always fit to the screen."
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
directories = "6"
tao = "0.36"
tray-icon = "0.24"

[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = "0.37"
# Already in the tree by way of tao and tray-icon, so naming it here adds no code —
# only the right to build the block the wake notification is delivered through.
block2 = "0.6"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["CFRunLoop"] }
objc2-foundation = { version = "0.3", features = [
    "NSString", "NSURL", "NSDictionary", "NSValue", "NSArray", "NSError",
    "NSDate", "NSTimeZone", "NSNotification", "NSOperation", "NSGeometry", "block2",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSWorkspace", "NSScreen", "NSColor", "NSCell", "objc2-core-foundation",
    # The favourites window. Most of these are already compiled in by way of tao
    # and tray-icon, but a feature nobody asks for is a feature a dependency may
    # stop asking for, and then the build breaks for reasons nothing here explains.
    "NSResponder", "NSView", "NSEvent", "NSGraphics", "NSBezierPath",
    "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext",
    "NSImageView", "NSScrollView", "NSClipView",
    "NSControl", "NSButton", "NSTextField", "NSFont", "NSParagraphStyle",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
